name: Build gamification preview

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature-duolingo-gamification
    - backup-before-gamification
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Compile Vite app
        run: npm run build
      - name: Save build output for preview
        uses: actions/upload-artifact@v4
        with:
          name: academia-industrial-gamification-dist
          path: dist/
          retention-days: 7
